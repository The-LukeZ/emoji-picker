name: release

# Runs when the "Release vX.Y.Z" pull request (branch `release` of this repo) is merged.
# The pack job builds the merge commit and packs it with Velopack. The release job then runs
# `knope release`: because knope.toml lists `assets`, knope creates the GitHub release and
# tag as a draft, uploads the Velopack files and publishes the release only after every
# upload succeeded. A failed upload leaves an unpublished draft, never a public release
# without assets.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Must match the exact `velopack` crate version in app/Cargo.toml.
  VPK_VERSION: 1.2.161
  REPO_URL: https://github.com/The-LukeZ/emoji-picker

jobs:
  pack:
    if: >-
      github.event.pull_request.merged == true &&
      github.head_ref == 'release' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/xtask-cache
            assets/generated
          key: assets-${{ hashFiles('xtask/**', 'core/src/table.rs') }}
      - name: Read the version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' app/Cargo.toml | head -n 1)"
          echo "Releasing v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build assets
        run: cargo xtask assets
      - name: Build app
        run: cargo build --release -p emoji-picker
      - name: Stage the files to pack
        # target/release also holds build intermediates; the app is the single exe.
        run: |
          mkdir -p target/vpk-pack
          cp target/release/emoji-picker.exe target/vpk-pack/
      - name: Install vpk
        run: dotnet tool install -g vpk --version "$VPK_VERSION"
      - name: Download the previous release (for delta packages)
        # Expected to fail on the first release only; later failures are flagged.
        run: |
          if vpk download github --repoUrl "$REPO_URL" --token "$GITHUB_TOKEN"; then
            echo "Previous release downloaded."
          else
            published="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq length || echo unknown)"
            if [ "$published" != "0" ]; then
              echo "::warning title=No delta packages::vpk download failed and this is not the first release (or the release list could not be read). This release ships without delta packages."
            else
              echo "No published release yet: this is the first release."
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack
        # Signing is not set up yet; vpk pack signing flags can be added here later.
        run: |
          mkdir -p Releases
          (cd Releases && sha256sum -- * 2>/dev/null || true) > before.sha256
          vpk pack \
            --packId emoji-picker \
            --packVersion "${{ steps.version.outputs.version }}" \
            --packDir target/vpk-pack \
            --mainExe emoji-picker.exe \
            --icon assets/generated/app.ico
      - name: Collect the new and changed files
        # Releases/ also holds the previous release's full package (from vpk download), which
        # is already attached to that release.
        run: |
          (cd Releases && sha256sum -- *) > after.sha256
          mkdir -p artifacts
          sort before.sha256 > before.sorted
          sort after.sha256 | comm -13 before.sorted - | while read -r _ name; do
            cp "Releases/${name#\*}" artifacts/
          done
          ls -l artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: velopack
          path: artifacts/
          if-no-files-found: error

  release:
    needs: [pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: velopack
          path: artifacts
      # knope-dev/action downloads the Linux build of knope, so this job runs on ubuntu.
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.24.0
      - name: Create the tag and release, upload the files, then publish
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
