name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: |
            target/xtask-cache
            assets/generated
          key: assets-${{ hashFiles('xtask/**', 'core/src/table.rs') }}
      - name: Build assets
        run: cargo xtask assets
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Search performance on real data
        run: cargo test -p emoji-core --release -- --ignored
      - name: Build app
        run: cargo build --release -p emoji-picker

  changeset:
    # Reminds contributors to describe user-facing changes. Warns only, never fails.
    if: github.event_name == 'pull_request' && github.head_ref != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for a change file
        run: |
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD -- app core)"
          added="$(git diff --name-only --diff-filter=A "$base"...HEAD -- '.changeset/*.md')"
          if [ -n "$changed" ] && [ -z "$added" ]; then
            echo "::warning title=No change file::app/ or core/ changed but no .changeset/*.md was added. Run 'knope document-change' if this change is user-facing."
          else
            echo "OK"
          fi
