name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/xtask-cache
            assets/generated
          key: assets-${{ hashFiles('xtask/**', 'core/src/table.rs') }}
      - name: Build assets
        run: cargo xtask assets
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Search performance on real data
        run: cargo test -p emoji-core --release -- --ignored
      - name: Build app
        run: cargo build --release -p emoji-picker

  changeset:
    # Reminds contributors to describe user-facing changes. Warns only, never fails.
    if: github.event_name == 'pull_request' && github.head_ref != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for a change file
        run: |
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD -- app core)"
          added="$(git diff --name-only --diff-filter=A "$base"...HEAD -- '.changeset/*.md')"
          if [ -n "$changed" ] && [ -z "$added" ]; then
            echo "::warning title=No change file::app/ or core/ changed but no .changeset/*.md was added. Run 'knope document-change' if this change is user-facing."
          else
            echo "OK"
          fi
