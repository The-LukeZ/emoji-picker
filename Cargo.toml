[workspace]
resolver = "2"
members = ["core", "xtask", "app"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
postcard = { version = "1", default-features = false, features = ["alloc"] }
toml = "1.2"
tempfile = "3"

# Smaller, faster release binary. panic stays "unwind": the extern "system" callbacks use
# catch_unwind. opt-level stays 3 (default) for search speed.
[profile.release]
lto = true
codegen-units = 1
strip = true
