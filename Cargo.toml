[workspace]
resolver = "2"
members = ["core"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
postcard = { version = "1", default-features = false, features = ["alloc"] }
toml = "0.8"
tempfile = "3"
